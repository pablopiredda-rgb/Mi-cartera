<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mi Cartera"/>
<meta name="theme-color" content="#0d1117"/>
<title>Mi Cartera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080c12;color:#e8f0f8;font-family:'Inter',sans-serif;font-size:14px;overscroll-behavior:none}
input,button,select{font-family:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer}button:active{opacity:.7}
.mono{font-family:'JetBrains Mono',monospace}
/* Topbar */
#topbar{background:#0e1620;border-bottom:1px solid #1a2840;padding:10px 14px;position:sticky;top:0;z-index:100}
.app-title{font-weight:800;font-size:15px}
.app-sub{font-size:9px;color:#5a7a92;margin-top:1px}
#price-ts{font-size:9px;color:#00bfae;margin-top:1px}
.ccl-row{display:flex;align-items:center;gap:6px;margin-left:auto}
.ccl-inp{background:#0d1117;border:1px solid #2a3f55;color:#e8f0f8;border-radius:5px;padding:4px 8px;font-size:12px;width:100px;font-family:'JetBrains Mono',monospace}
/* Tabs */
#tabs{display:flex;gap:3px;background:#0d1117;padding:3px;border-radius:7px;margin-top:8px}
.tab{padding:5px 10px;border-radius:5px;border:none;font-size:11px;font-weight:700;background:transparent;color:#5a7a92}
.tab.on{background:#00bfae;color:#000}
/* Summary */
#sumbar{background:#0e1620;border-bottom:1px solid #1a2840;padding:10px 14px}
.krow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;overflow-x:auto}
.kpi .kl{font-size:9px;color:#7a9ab2;letter-spacing:.6px;text-transform:uppercase}
.kpi .kv{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px}
.dbar{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px}
.dlabels{display:flex;gap:12px;margin-top:4px;font-size:9px}
/* Filterbar */
#fbar{padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1a2840;background:#0e1620}
.si{background:#080c12;border:1px solid #1a2840;color:#e8f0f8;border-radius:5px;padding:6px 10px;font-size:12px;width:130px}
.fb{background:transparent;border:1px solid #1a2840;color:#7a9ab2;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600}
.fb.on{background:#00bfae;color:#000;border-color:#00bfae}
/* Col headers */
#colh{display:grid;grid-template-columns:72px 1fr 100px 105px 36px;gap:4px;padding:6px 22px;border-bottom:1px solid #1a2840;background:#0e1620;font-size:9px;color:#5a7a92;letter-spacing:.6px;text-transform:uppercase}
/* Section header */
.sh{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;background:#080c12;border-top:1px solid #1a2840}
.sbar{flex:1;height:1px}
/* Stock row */
.sr{border-bottom:1px solid #0d1520;border-left:3px solid transparent;background:#111a26;margin:3px 8px;border-radius:8px;overflow:hidden}
.sr.open{background:#162030}
.sm{display:grid;grid-template-columns:72px 1fr 100px 105px 36px;gap:4px;padding:11px 14px;cursor:pointer;align-items:center}
.tk{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;color:#fff}
.rl{font-size:9px;margin-top:1px}
.pills{display:flex;gap:3px;flex-wrap:wrap}
.pill{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;white-space:nowrap}
.pc{text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff;font-weight:700}
.pl{text-align:right}
.pm{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.ps{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.8}
.np{color:#5a7a92;font-size:10px;text-align:right}
.cv{text-align:right;font-size:11px;color:#5a7a92}
/* Expanded */
.exp{padding:4px 14px 14px}
.pd{display:flex;gap:14px;flex-wrap:wrap;background:#0d1117;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px}
.pi{color:#7a9ab2}.pi span{color:#fff;font-weight:600}
.mag{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.mp{background:#0d1117;border-radius:8px;padding:10px}
.mt{font-size:9px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.mbr{margin-bottom:5px}
.mbl{display:flex;justify-content:space-between;font-size:9px;margin-bottom:2px}
.mbt{background:#1f2d3d;border-radius:2px;height:3px}
.mbf{height:3px;border-radius:2px}
.sigs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.sig{border-radius:5px;padding:4px 7px;font-size:10px}
.lmb{background:rgba(0,191,174,.1);border:1px solid #00bfae;color:#00bfae;border-radius:5px;padding:6px 12px;font-size:11px;font-weight:600;margin-bottom:8px}
.rb{background:transparent;border:1px solid #5a7a92;color:#5a7a92;border-radius:4px;padding:3px 8px;font-size:9px;margin-top:6px}
/* Operar tab */
.of{background:#0e1620;border-radius:12px;padding:16px;margin:12px;border:1px solid #1a2840}
.ot{font-weight:700;font-size:15px;margin-bottom:14px}
.or{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ol{font-size:10px;color:#7a9ab2;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.oi{background:#080c12;border:1px solid #1a2840;color:#e8f0f8;border-radius:6px;padding:9px 11px;font-size:13px;width:100%;font-family:'JetBrains Mono',monospace}
.oi:focus{border-color:#00bfae;outline:none}
.os{background:#080c12;border:1px solid #1a2840;color:#e8f0f8;border-radius:6px;padding:9px 11px;font-size:13px;width:100%}
.opv{background:#080c12;border-radius:8px;padding:12px;margin:10px 0;display:none}
.opv.show{display:block}
.pvr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.pvl{color:#7a9ab2}.pvv{font-family:'JetBrains Mono',monospace;font-weight:700}
.ob{width:100%;padding:13px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;display:none}
.ob.buy{background:#2ecc8a;color:#000}
.ob.sell{background:#e05555;color:#fff}
.oh{background:#0e1620;border-radius:12px;padding:16px;margin:0 12px 12px;border:1px solid #1a2840}
.oht{font-weight:700;font-size:13px;margin-bottom:10px;color:#7a9ab2}
.ohr{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1a2840;font-size:11px;align-items:center}
/* Summary tab */
#stab{padding:12px 14px 80px}
.sc{background:#0e1620;border-radius:10px;padding:14px;margin-bottom:12px}
.sct{font-weight:700;margin-bottom:12px;font-size:14px}
.di{margin-bottom:8px}
.dir{display:flex;justify-content:space-between;margin-bottom:2px;flex-wrap:wrap;gap:4px}
.dt{background:#1f2d3d;border-radius:2px;height:4px}
.df{height:4px;border-radius:2px}
/* Misc */
.green{color:#2ecc8a}.red{color:#e05555}.cyan{color:#00bfae}.amber{color:#f0a500}
.footer{text-align:center;color:#5a7a92;font-size:9px;padding:20px 14px 80px;font-family:'JetBrains Mono',monospace}
</style>
</head>

</div>

/* Helpers */
const fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fU=n=>'$'+fmt(n,2);
const fA=n=>'$'+fmt(n,0)+' ARS';
const pct=n=>(n>=0?'+':'')+fmt(n,2)+'%';
const clr=n=>n>=0?'#2ecc8a':'#e05555';
const gc=s=>s.isArg?'#f0a500':s.group==='high'?'#7c5cfc':'#2a7fd4';

function rl(s){
  if(!s.ma50d) return null;
  const a=[s.ma8d,s.ma21d,s.ma50d,s.ma200d].filter(m=>m&&s.currentPrice>m).length;
  if(a===4) return{l:'Alcista',d:'●',c:'#2ecc8a'};
  if(a>=2)  return{l:'Neutral',d:'◆',c:'#f0a500'};
  return {l:'Bajista',d:'▼',c:'#e05555'};
}

/* CCL & price fetch */
async function fetchCCL(){
  try{ const r=await fetch('https://api.bluelytics.com.ar/v2/latest'); const j=await r.json(); return j?.ccl?.value_buy||null; }catch{}
  try{ const r=await fetch('https://dolarapi.com/v1/dolares/contadoconliqui'); const j=await r.json(); return j?.compra||null; }catch{}
  return null;
}

const TD='https://api.twelvedata.com';
const TK='7e22288b7d4a4944aea9c62a872a4c6c';
let credDay=parseInt(localStorage.getItem('td_cr_'+new Date().toDateString())||'0');
function trackCr(){ credDay++; localStorage.setItem('td_cr_'+new Date().toDateString(),credDay); }

function sGet(url){ return fetch(url).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function fetchMA(ticker){
  const t=ticker.replace('.BA','');
  try{
    const getSMA=async(period,interval)=>{
      try{ const j=await sGet(`${TD}/sma?symbol=${t}&interval=${interval}&time_period=${period}&outputsize=1&apikey=${TK}`); trackCr(); if(j.status==='error') return null; return parseFloat(j.values?.[0]?.sma)||null; }catch{ return null; }
    };
    const pj=await sGet(`${TD}/price?symbol=${t}&apikey=${TK}`); trackCr();
    if(pj.code||pj.status==='error') return null;
    const cp=parseFloat(pj.price)||null;
    await wait(500); const ma8d=await getSMA(8,'1day');
    await wait(500); const ma21d=await getSMA(21,'1day');
    await wait(500); const ma50d=await getSMA(50,'1day');
    await wait(500); const ma200d=await getSMA(200,'1day');
    await wait(500); const ma8w=await getSMA(8,'1week');
    await wait(500); const ma21w=await getSMA(21,'1week');
    await wait(500); const ma50w=await getSMA(50,'1week');
    await wait(500); const ma200w=await getSMA(200,'1week');
    return{currentPrice:cp,ma8d,ma21d,ma50d,ma200d,ma8w,ma21w,ma50w,ma200w};
  }catch{ return null; }
}

async function updatePrices(){
  const usd=S.stocks.filter(s=>!s.isArg);
  if(credDay>=750){ document.getElementById('price-ts').textContent='⚠ Límite diario alcanzado'; return; }
  for(let i=0;i<usd.length;i++){
    const s=usd[i];
    try{
      const j=await sGet(`${TD}/quote?symbol=${s.ticker}&apikey=${TK}`); trackCr();
      if(j.status==='error'||j.code) continue;
      s.currentPrice=parseFloat(j.close)||s.currentPrice;
      const prev=parseFloat(j.previous_close)||null;
      s.dc=prev?s.currentPrice-prev:null;
      s.dcp=prev?(s.dc/prev)*100:null;
      const ts=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('price-ts').textContent='Precios actualizados: '+ts;
      document.getElementById('price-ts').style.color='#00bfae';
      renderSummary();
      if(S.tab==='open'||S.tab==='watch') renderStockList();
    }catch{}
    if(i<usd.length-1) await wait(10000);
  }
}

/* TAB NAVIGATION - clean and simple */
function goTab(t){
  S.tab=t;
  // Update tab buttons
  ['open','watch','operar','summary'].forEach(id=>{
    const el=document.getElementById('tab-'+id);
    if(el) el.className='tab'+(t===id?' on':'');
  });
  // Show/hide filter bar and col headers
  const showList=(t==='open'||t==='watch');
  document.getElementById('fbar').style.display=showList?'flex':'none';
  document.getElementById('colh').style.display=showList?'grid':'none';
  // Render content
  renderMain();
}

/* RENDER */
function renderSummary(){
  const ccl=getCCL();
  const usd=S.stocks.filter(s=>!s.isArg);
  const ars=S.stocks.filter(s=>s.isArg);
  const tU=usd.reduce((a,s)=>a+s.shares*s.currentPrice,0);
  const tC=usd.reduce((a,s)=>a+s.shares*s.avgCost,0);
  const pnl=tU-tC; const pp=tC?pnl/tC*100:0;
  const tA=ars.reduce((a,s)=>a+s.shares*s.currentPrice,0);
  const aU=ccl?tA/ccl:0;
  const grand=tU+aU;
  const hV=usd.filter(s=>s.group==='high').reduce((a,s)=>a+s.shares*s.currentPrice,0);
  const cV=usd.filter(s=>s.group==='cons').reduce((a,s)=>a+s.shares*s.currentPrice,0);
  const hp=grand?hV/grand*100:0,cp2=grand?cV/grand*100:0,ap=grand?aU/grand*100:0;
  document.getElementById('sumbar').innerHTML=`
    <div class="krow">
      <div class="kpi"><div class="kl">Cartera USD</div><div class="kv cyan">$${fmt(tU,0)}</div></div>
      <div class="kpi"><div class="kl">P&L USD</div><div class="kv" style="color:${clr(pnl)}">${pnl>=0?'+':''}$${fmt(pnl,0)}</div></div>
      <div class="kpi"><div class="kl">Retorno</div><div class="kv" style="color:${clr(pp)}">${pct(pp)}</div></div>
      <div class="kpi"><div class="kl">Cartera ARS</div><div class="kv amber">$${fmt(tA,0)}</div></div>
      <div class="kpi"><div class="kl">CCL</div><div class="kv" style="color:#8aa5bb">${ccl?'$'+fmt(ccl,0):'—'}</div></div>
      <div class="kpi"><div class="kl">Total equiv.</div><div class="kv">$${fmt(grand,0)} USD</div></div>
    </div>
    <div class="dbar">
      <div style="width:${hp}%;background:#7c5cfc;min-width:${hp>0?2:0}px"></div>
      <div style="width:${cp2}%;background:#2a7fd4;min-width:${cp2>0?2:0}px"></div>
      <div style="width:${ap}%;background:#f0a500;min-width:${ap>0?2:0}px"></div>
    </div>
    <div class="dlabels">
      <span style="color:#7c5cfc">■ IA/Tech ${fmt(hp,1)}%</span>
      <span style="color:#2a7fd4">■ Conserv. ${fmt(cp2,1)}%</span>
      <span style="color:#f0a500">■ ARG ${fmt(ap,1)}%</span>
    </div>`;
}

function maBar(label,price,ma,w){
  if(!ma||!price) return '';
  const p=((price-ma)/ma*100),wd=Math.min(Math.abs(p)*2.5,100),c=p>=0?'#2ecc8a':'#e05555';
  return`<div class="mbr"><div class="mbl"><span style="color:${w?'#f0a500':'#00bfae'};font-family:monospace;font-size:9px">${label}</span><span style="color:${c};font-family:monospace;font-size:10px">${p>=0?'+':''}${p.toFixed(1)}%</span></div><div class="mbt"><div class="mbf" style="width:${wd}%;background:${c}"></div></div></div>`;
}

function stockRow(s, lk){
  const ccl=getCCL();
  const p=s.currentPrice;
  const pnlV=s.shares>0?(p-s.avgCost)*s.shares:null;
  const pnlP=s.shares>0&&s.avgCost?(p-s.avgCost)/s.avgCost*100:null;
  const posV=s.shares*p;
  const r=rl(s); const g=gc(s);
  const isOpen=S.exp[lk+s.ticker];
  const loading=S.loadingMA[lk+s.ticker]==='loading';
  const maOk=s.ma50d>0;

  // P&L column
  const hasDC=s.dcp!=null;
  const plHTML=`<div style="text-align:right">
    ${hasDC?`<div class="pm" style="color:${clr(s.dcp)}">${s.dcp>=0?'+':''}${fmt(s.dcp,2)}% hoy</div><div class="ps" style="color:${clr(s.dc)}">${s.dc>=0?'+':''}${fU(s.dc)}</div>`:''}
    ${pnlV!=null?`<div class="ps" style="color:${clr(pnlP)};${hasDC?'border-top:1px solid #1a2840;padding-top:2px;margin-top:2px':''}">${pct(pnlP)} total</div>`:`${!hasDC?'<div class="np">seguimiento</div>':''}`}
  </div>`;

  let exp='';
  if(isOpen){
    const pd=s.shares>0?`<div class="pd">
      <span class="pi">Acciones: <span>${fmt(s.shares,4)}</span></span>
      <span class="pi">Prom: <span>${s.isArg?fA(s.avgCost):fU(s.avgCost)}</span></span>
      <span class="pi">Valor: <span>${s.isArg?fA(posV):fU(posV)}</span></span>
      ${pnlV!=null?`<span class="pi">P&L: <span style="color:${clr(pnlV)}">${pnlV>=0?'+':''}${fU(pnlV)} (${pct(pnlP)})</span></span>`:''}
      ${!s.isArg&&ccl?`<span class="pi">ARS: <span style="color:#f0a500">${fA(posV*ccl)}</span></span>`:''}
    </div>`:'';
    const maS=maOk?`
      <div class="mag">
        <div class="mp"><div class="mt" style="color:#00bfae">DIARIAS</div>${[['MA 8D',s.ma8d],['MA 21D',s.ma21d],['MA 50D',s.ma50d],['MA 200D',s.ma200d]].map(([l,m])=>maBar(l,p,m,false)).join('')}</div>
        <div class="mp"><div class="mt" style="color:#f0a500">SEMANALES</div>${[['MA 8W',s.ma8w],['MA 21W',s.ma21w],['MA 50W',s.ma50w],['MA 200W',s.ma200w]].map(([l,m])=>maBar(l,p,m,true)).join('')}</div>
      </div>
      <div class="sigs">${[
        {l:'Entrada corto',ok:s.ma8d&&s.ma21d&&p>s.ma8d&&p>s.ma21d,d:false},
        {l:'Tend. media',ok:s.ma50d&&p>s.ma50d,d:false},
        {l:'Bull LP',ok:s.ma200d&&p>s.ma200d,d:false},
        {l:'⚠ Riesgo',ok:s.ma50d&&p<s.ma50d,d:true},
      ].filter(c=>!c.d||c.ok).map(c=>{const col=c.d?'#e05555':(c.ok?'#2ecc8a':'#5a7a92');return`<div class="sig" style="background:${col}18;border:1px solid ${col}33;color:${col}">${c.ok?(c.d?'⚠':'✓'):'—'} ${c.l}</div>`;}).join('')}</div>
      <button class="rb" onclick="loadMA(event,'${s.ticker}','${lk}')">↺ Actualizar MAs</button>`
    :`<button class="lmb" onclick="loadMA(event,'${s.ticker}','${lk}')">${loading?'Cargando…':'↓ Cargar Medias Móviles'}</button>`;
    exp=`<div class="exp">${pd}${maS}</div>`;
  }

  return`<div class="sr${isOpen?' open':''}" style="border-left-color:${g}" id="row-${lk}-${s.ticker.replace(/\./g,'-')}">
    <div class="sm" onclick="toggle('${s.ticker}','${lk}')">
      <div><div class="tk">${s.ticker}</div>${r?`<div class="rl" style="color:${r.c}">${r.d} ${r.l}</div>`:''}</div>
      <div class="pills">${pill(s.isArg?'ARG':s.group==='high'?'IA/Tech':'Conserv.',g)}${maOk?pill('MA✓','#00bfae'):''}</div>
      <div class="pc">${s.isArg?fA(p):fU(p)}</div>
      ${plHTML}
      <div class="cv">${isOpen?'▲':'▼'}</div>
    </div>${exp}
  </div>`;
}

  const src=S.tab==='open'?S.stocks.filter(s=>s.shares>0.001):S.watch;
  const lk=S.tab==='watch'?'w':'p';
  let list=src.filter(s=>{
    if(S.filter==='high'&&(s.group!=='high'||s.isArg)) return false;
    if(S.filter==='cons'&&(s.group!=='cons'||s.isArg)) return false;
    if(S.filter==='arg'&&!s.isArg) return false;
    if(S.search&&!s.ticker.toLowerCase().includes(S.search.toLowerCase())) return false;
    return true;
  });
  const all=S.filter==='all';
  let html='';
  if(all||S.filter==='high'){ const l=list.filter(s=>s.group==='high'&&!s.isArg); if(l.length) html+=secHead('IA / TECNOLOGÍA / ALTA VOLATILIDAD','#7c5cfc',l)+l.map(s=>stockRow(s,lk)).join(''); }
  if(all||S.filter==='cons'){ const l=list.filter(s=>s.group==='cons'&&!s.isArg); if(l.length) html+=secHead('CONSERVADORAS / CEDEAR','#2a7fd4',l)+l.map(s=>stockRow(s,lk)).join(''); }
  if(all||S.filter==='arg'){  const l=list.filter(s=>s.isArg);                    if(l.length) html+=secHead('ACCIONES ARGENTINAS — BYMA (ARS)','#f0a500',l)+l.map(s=>stockRow(s,lk)).join(''); }
  if(!html) html='<div style="color:#5a7a92;text-align:center;padding:40px">Sin resultados.</div>';
  html+=`<div class="footer">Posiciones verificadas · Precios con delay · MAs bajo demanda</div>`;
  document.getElementById('main').innerHTML=html;
}

function renderOperarTab(){
  const ccl=getCCL()||1500;
  const hist=S.opHist.length===0
    ?'<div style="color:#5a7a92;font-size:12px;text-align:center;padding:16px">Sin operaciones registradas</div>'
    :S.opHist.slice(0,30).map(o=>{
        const c=o.tipo==='buy'?'#2ecc8a':'#e05555';
        return`<div class="ohr"><span style="font-family:monospace;font-weight:700;min-width:55px;color:${c}">${o.ticker}</span>
          <span style="flex:1;color:#7a9ab2;font-size:10px">${o.date}<br>${o.cedears} CEDEARs @ $${(o.precioARS||0).toLocaleString('es-AR')}</span>
          <span style="font-family:monospace;text-align:right;color:${c};font-size:11px">${o.tipo==='buy'?'+':'-'}${o.accionesUSA} acc<br>$${o.costoUSD} USD</span>
        </div>`;
      }).join('');

  document.getElementById('main').innerHTML=`
    <div class="of">
      <div class="ot">Nueva Operación</div>
      <div class="or">
        <div><div class="ol">Ticker</div><input class="oi" id="op-t" type="text" placeholder="ej: NVDA" oninput="this.value=this.value.toUpperCase();calcPrev()"/></div>
        <div><div class="ol">Tipo</div><select class="os" id="op-tipo" onchange="calcPrev()"><option value="buy">COMPRA</option><option value="sell">VENTA</option></select></div>
      </div>
      <div class="or">
        <div><div class="ol">Instrumento</div><select class="os" id="op-inst" onchange="calcPrev()"><option value="cedear">CEDEAR (USA)</option><option value="arg">Acción ARG</option></select></div>
        <div><div class="ol">CCL ($)</div><input class="oi" id="op-ccl" type="number" value="${ccl}" oninput="calcPrev()"/></div>
      </div>
      <div class="or">
        <div><div class="ol">Cantidad</div><input class="oi" id="op-qty" type="number" placeholder="ej: 150" oninput="calcPrev()"/></div>
        <div><div class="ol">Precio ARS c/u</div><input class="oi" id="op-ars" type="number" placeholder="ej: 4620" oninput="calcPrev()"/></div>
      </div>
      <div class="opv" id="op-prev"></div>
      <button class="ob" id="op-btn" onclick="confirmOp()">✓ Confirmar</button>
    </div>
    <div class="oh">
      <div class="oht">Historial (${S.opHist.length})</div>
      ${hist}
    </div>`;
}

function renderSummaryTab(){
  const ccl=getCCL()||1;
  const grand=S.stocks.reduce((a,s)=>a+s.shares*s.currentPrice*(s.isArg?1/ccl:1),0);
  const sorted=[...S.stocks].filter(s=>s.shares>0.001).sort((a,b)=>{
    return b.shares*b.currentPrice*(b.isArg?1/ccl:1)-a.shares*a.currentPrice*(a.isArg?1/ccl:1);
  });
  const items=sorted.map(s=>{
    const v=s.shares*s.currentPrice,vU=s.isArg?v/ccl:v,pp=grand?vU/grand*100:0;
    const pnl=s.avgCost?(s.currentPrice-s.avgCost)*s.shares:0;
    const pp2=s.avgCost?(s.currentPrice-s.avgCost)/s.avgCost*100:0;
    const g=gc(s);
    return`<div class="di">
      <div class="dir">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="font-family:monospace;font-weight:700;min-width:75px;font-size:12px">${s.ticker}</span>
          <span style="font-size:10px;color:#5a7a92">${s.isArg?fA(v):fU(v)}</span>
          ${s.avgCost>0?`<span style="font-family:monospace;font-size:10px;color:${clr(pnl)}">${pnl>=0?'+':''}${fU(pnl)} (${pct(pp2)})</span>`:''}
        </div>
        <span style="font-family:monospace;font-size:11px;color:${g}">${fmt(pp,1)}%</span>
      </div>
      <div class="dt"><div class="df" style="width:${pp}%;background:${g}"></div></div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`<div id="stab"><div class="sc"><div class="sct">Distribución por posición</div>${items}</div></div>`;
}

function renderMain(){
  if(S.tab==='operar'){ renderOperarTab(); return; }
  if(S.tab==='summary'){ renderSummaryTab(); return; }
  renderFilterBar();
  renderStockList();
}

/* Actions */
function toggle(ticker, lk){
  const key=lk+ticker;
  S.exp[key]=!S.exp[key];
  renderStockList();
  setTimeout(()=>{ const el=document.getElementById('row-'+lk+'-'+ticker.replace(/\./g,'-')); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); },50);
}

async function loadMA(e, ticker, lk){
  e.stopPropagation();
  const key=lk+ticker;
  if(S.loadingMA[key]==='loading') return;
  S.loadingMA[key]='loading';
  renderStockList();
  const data=await fetchMA(ticker);
  const list=lk==='w'?S.watch:S.stocks;
  const s=list.find(x=>x.ticker===ticker);
  if(data&&s){ Object.assign(s,data); S.loadingMA[key]='done'; }
  else S.loadingMA[key]='error';
  renderStockList();
}

/* Operar functions */
function calcPrev(){
  const t=document.getElementById('op-t').value.trim().toUpperCase();
  const tipo=document.getElementById('op-tipo').value;
  const inst=document.getElementById('op-inst').value;
  const qty=parseFloat(document.getElementById('op-qty').value)||0;
  const ars=parseFloat(document.getElementById('op-ars').value)||0;
  const ccl=parseFloat(document.getElementById('op-ccl').value)||1500;
  const prev=document.getElementById('op-prev');
  const btn=document.getElementById('op-btn');
  if(!t||!qty||!ars){ prev.className='opv'; btn.style.display='none'; return; }
  let ratio=1,accs,usd;
  if(inst==='arg'){ accs=qty; usd=ars/ccl; }
  else{
    ratio=BR[t]||BR[t.replace('-','')];
    if(!ratio){ prev.className='opv show'; prev.innerHTML=`<div style="color:#e05555;font-size:12px">⚠ Ticker no encontrado. Buscá el ratio en BYMA e ingresalo:</div><div style="margin-top:8px"><div class="ol">Ratio (CEDEARs por 1 acción USA)</div><input class="oi" id="op-ratio" type="number" placeholder="ej: 25" oninput="calcPrev()" style="margin-top:4px"/></div>`; btn.style.display='none';
      const mr=parseFloat(document.getElementById('op-ratio')?.value)||0; if(!mr) return; ratio=mr; }
    accs=qty/ratio; usd=ars*ratio/ccl;
  }
  const pos=S.stocks.find(s=>s.ticker===t);
  let nQ=accs,nP=usd;
  if(tipo==='buy'&&pos&&pos.shares>0){ nQ=pos.shares+accs; nP=(pos.shares*pos.avgCost+accs*usd)/nQ; }
  else if(tipo==='sell'&&pos){ nQ=Math.max(0,pos.shares-accs); }
  prev.className='opv show';
  prev.innerHTML=`<div style="font-size:10px;color:#00bfae;font-weight:700;margin-bottom:8px">PREVIEW</div>
    <div class="pvr"><span class="pvl">Ticker</span><span class="pvv">${t}</span></div>
    ${inst!=='arg'?`<div class="pvr"><span class="pvl">Ratio BYMA</span><span class="pvv">${ratio}:1</span></div>`:''}
    <div class="pvr"><span class="pvl">Acciones USA equiv.</span><span class="pvv">${accs.toFixed(4)}</span></div>
    <div class="pvr"><span class="pvl">Precio USD/acc</span><span class="pvv">$${usd.toFixed(2)}</span></div>
    <div class="pvr" style="border-top:1px solid #1a2840;padding-top:8px;margin-top:4px">
      <span class="pvl">Nueva posición</span>
      <span class="pvv" style="color:${tipo==='buy'?'#2ecc8a':'#e05555'}">${nQ.toFixed(4)} acc @ $${nP.toFixed(2)}</span>
    </div>`;
  btn.className='ob '+(tipo==='buy'?'buy':'sell');
  btn.style.display='block';
  btn.textContent=tipo==='buy'?'✓ Confirmar Compra':'✓ Confirmar Venta';
}

function confirmOp(){
  const t=document.getElementById('op-t').value.trim().toUpperCase();
  const tipo=document.getElementById('op-tipo').value;
  const inst=document.getElementById('op-inst').value;
  const qty=parseFloat(document.getElementById('op-qty').value)||0;
  const ars=parseFloat(document.getElementById('op-ars').value)||0;
  const ccl=parseFloat(document.getElementById('op-ccl').value)||1500;
  let ratio=inst==='arg'?1:(BR[t]||BR[t.replace('-','')]||parseFloat(document.getElementById('op-ratio')?.value)||1);
  const accs=inst==='arg'?qty:qty/ratio;
  const usd=inst==='arg'?ars/ccl:ars*ratio/ccl;
  let s=S.stocks.find(x=>x.ticker===t);
  if(tipo==='buy'){
    if(s){ const nQ=s.shares+accs; s.avgCost=(s.shares*s.avgCost+accs*usd)/nQ; s.shares=nQ; }
    else{ const g=inst==='arg'?'arg':(['NVDA','META','MSFT','GOOG','TSLA','PLTR','HUT','IREN','MSTR','OKLO','TQQQ','RKLB','ALAB','NBIS','ANET','CEG','VST','GE','IBM','SNDK','ETHA','URA','MELI','SPOT','NFLX','AVGO','NU','MU','BIDU','FSLR','ADBE','CRM'].includes(t)?'high':'cons'); S.stocks.push({ticker:t,shares:accs,avgCost:usd,currentPrice:usd,group:g,isArg:inst==='arg',ma8d:0,ma21d:0,ma50d:0,ma200d:0,ma8w:0,ma21w:0,ma50w:0,ma200w:0,dc:null,dcp:null}); }
  } else { if(s) s.shares=Math.max(0,s.shares-accs); }
  const op={date:new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}),ticker:t,tipo,cedears:qty,ratio,accionesUSA:+accs.toFixed(4),precioARS:ars,costoUSD:+usd.toFixed(2),ccl};
  S.opHist.unshift(op);
  if(S.opHist.length>200) S.opHist.pop();
  localStorage.setItem('op_hist',JSON.stringify(S.opHist));
  alert('✓ '+t+': '+(tipo==='buy'?'Compra':'Venta')+' registrada — '+accs.toFixed(4)+' acc @ $'+usd.toFixed(2));
  goTab('open');
}

/* Init */
fetchCCL().then(v=>{ if(v){ S.ccl=v; document.getElementById('ccl-input').placeholder=fmt(v,0)+' (auto)'; } renderSummary(); });
renderSummary();
renderFilterBar();
renderMain();
setInterval(updatePrices, 1200000);
setTimeout(updatePrices, 3000);
</script>
</body>
