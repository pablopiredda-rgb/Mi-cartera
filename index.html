<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080c12;color:#e8f0f8;font-family:'Inter','Helvetica Neue',sans-serif;font-size:14px;overscroll-behavior:none}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#1f2d3d;border-radius:2px}
input,button{font-family:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer;transition:opacity .15s}button:active{opacity:.7}
.mono{font-family:'JetBrains Mono','Fira Mono',monospace}
#topbar{background:#0e1620;border-bottom:1px solid #1a2840;padding:10px 14px;position:sticky;top:0;z-index:100}
#topbar-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.app-title{font-weight:800;font-size:15px;letter-spacing:-.3px}
.app-sub{font-size:9px;color:#5a7a92;margin-top:1px}
.ccl-row{display:flex;align-items:center;gap:6px;margin-left:auto}
.ccl-input{background:#0d1117;border:1px solid #2a3f55;color:#d0dde8;border-radius:5px;padding:4px 8px;font-size:12px;width:100px;font-family:'JetBrains Mono',monospace}
#tabs{display:flex;gap:3px;background:#0d1117;padding:3px;border-radius:7px;margin-top:8px}
.tab{padding:5px 10px;border-radius:5px;border:none;font-size:11px;font-weight:700;background:transparent;color:#5a7a92;transition:all .15s}
.tab.active{background:#00bfae;color:#000}
#summary{background:#0e1620;border-bottom:1px solid #1a2840;padding:10px 14px}
.kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;overflow-x:auto}
.kpi{flex-shrink:0}.kpi-label{font-size:9px;color:#7a9ab2;letter-spacing:.6px;text-transform:uppercase}
.kpi-val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:15px}
.dist-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px}
.dist-labels{display:flex;gap:12px;margin-top:4px}
.dist-label{font-size:9px;display:flex;align-items:center;gap:4px}
.dist-dot{width:6px;height:6px;border-radius:1px;display:inline-block;flex-shrink:0}
#filterbar{padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1a2840;background:#0e1620}
.search-input{background:#080c12;border:1px solid #1a2840;color:#e8f0f8;border-radius:5px;padding:6px 10px;font-size:12px;width:130px}
.filter-btn{background:transparent;border:1px solid #1a2840;color:#7a9ab2;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600}
.filter-btn.active{background:#00bfae;color:#000;border-color:#00bfae}
.col-headers{display:grid;grid-template-columns:72px 1fr 100px 105px 36px;gap:4px;padding:6px 22px;border-bottom:1px solid #1a2840;background:#0e1620}
.col-h{font-size:9px;color:#5a7a92;letter-spacing:.6px;text-transform:uppercase}
.section-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;background:#080c12;border-top:1px solid #1a2840}
.section-bar{flex:1;height:1px}.section-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a7a92}
.stock-row{border-bottom:1px solid #0d1520;border-left:3px solid transparent;transition:background .1s;background:#111a26;margin:3px 8px;border-radius:8px;overflow:hidden}
.stock-row.open{background:#162030}
.stock-main{display:grid;grid-template-columns:72px 1fr 100px 105px 36px;gap:4px;padding:11px 14px;cursor:pointer;align-items:center;user-select:none}
.ticker{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;color:#ffffff;letter-spacing:.3px}
.risk-label{font-size:9px;margin-top:1px}
.pills{display:flex;gap:3px;flex-wrap:wrap}
.pill{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.price-cell{text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;color:#ffffff;font-weight:700}
.pnl-cell{text-align:right}
.pnl-main{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.pnl-sub{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.8}
.no-pos{color:#5a7a92;font-size:10px;text-align:right}
.chevron{text-align:right;font-size:11px;color:#6a8aaa}
.expanded{padding:4px 14px 14px}
.pos-detail{display:flex;gap:14px;flex-wrap:wrap;background:#080c12;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px}
.pos-item{color:#7a9ab2}.pos-item span{color:#ffffff;font-weight:600}
.ma-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.ma-panel{background:#080c12;border-radius:8px;padding:10px}
.ma-panel-title{font-size:9px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.ma-bar-row{margin-bottom:5px}
.ma-bar-labels{display:flex;justify-content:space-between;font-size:9px;margin-bottom:2px}
.ma-bar-track{background:#1f2d3d;border-radius:2px;height:3px}
.ma-bar-fill{height:3px;border-radius:2px;transition:width .3s}
.signals{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.signal{border-radius:5px;padding:4px 7px;font-size:10px}
.signal-sub{font-size:8px;margin-top:1px;opacity:.7}
.load-ma-btn{background:rgba(0,191,174,.1);border:1px solid #00bfae;color:#00bfae;border-radius:5px;padding:6px 12px;font-size:11px;font-weight:600;margin-bottom:8px}
.refresh-btn{background:transparent;border:1px solid #5a7a92;color:#5a7a92;border-radius:4px;padding:3px 8px;font-size:9px;margin-top:6px}
#trades-wrap{overflow-x:auto;padding:0 0 80px}
.trades-header{padding:12px 16px;font-weight:700;font-size:14px;border-bottom:1px solid #1f2d3d;background:#131920;position:sticky;top:0}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:480px}
th{padding:7px 12px;text-align:left;font-size:9px;color:#5a7a92;letter-spacing:.6px;text-transform:uppercase;font-weight:600;border-bottom:1px solid #1f2d3d}
td{padding:6px 12px;border-bottom:1px solid rgba(31,45,61,.4)}
#summary-tab{padding:12px 14px 80px}
.sum-card{background:#0e1620;border-radius:10px;padding:14px;margin-bottom:12px}
.sum-card-title{font-weight:700;margin-bottom:12px;font-size:14px}
.dist-item{margin-bottom:8px}
.dist-item-row{display:flex;justify-content:space-between;margin-bottom:2px;flex-wrap:wrap;gap:4px}
.dist-track{background:#1f2d3d;border-radius:2px;height:4px}
.dist-fill{height:4px;border-radius:2px;transition:width .5s}
.green{color:#2ecc8a}.red{color:#e05555}.cyan{color:#00bfae}.amber{color:#f0a500}.dim{color:#5a7a92}
.empty{color:#5a7a92;text-align:center;padding:40px}
.footer{text-align:center;color:#5a7a92;font-size:9px;padding:20px 14px 80px;font-family:'JetBrains Mono',monospace}
/* Operar tab */
.op-form{background:#0e1620;border-radius:12px;padding:16px;margin:12px;border:1px solid #1a2840}
.op-title{font-weight:700;font-size:15px;margin-bottom:14px;color:#e8f0f8}
.op-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.op-label{font-size:10px;color:#7a9ab2;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.op-input{background:#080c12;border:1px solid #1a2840;color:#e8f0f8;border-radius:6px;padding:9px 11px;font-size:13px;width:100%;font-family:'JetBrains Mono',monospace}
.op-input:focus{border-color:#00bfae;outline:none}
.op-select{background:#080c12;border:1px solid #1a2840;color:#e8f0f8;border-radius:6px;padding:9px 11px;font-size:13px;width:100%}
.op-preview{background:#080c12;border-radius:8px;padding:12px;margin:10px 0;display:none}
.op-preview.show{display:block}
.op-preview-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.op-preview-label{color:#7a9ab2}
.op-preview-val{font-family:'JetBrains Mono',monospace;color:#e8f0f8;font-weight:700}
.op-btn{width:100%;padding:13px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.op-btn-buy{background:#2ecc8a;color:#000}
.op-btn-sell{background:#e05555;color:#fff}
.op-hist{background:#0e1620;border-radius:12px;padding:16px;margin:12px;border:1px solid #1a2840;margin-top:0}
.op-hist-title{font-weight:700;font-size:13px;margin-bottom:10px;color:#7a9ab2}
.op-hist-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1a2840;font-size:11px;align-items:center}
.op-hist-ticker{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:55px}
.op-hist-detail{flex:1;color:#7a9ab2}
.op-hist-val{font-family:'JetBrains Mono',monospace;text-align:right}
</style>

async function fetchCCL(){

  try{const r=await fetch('https://dolarapi.com/v1/dolares/contadoconliqui');const j=await r.json();return j?.compra||null;}catch{}
  return null;
}
const TWELVE_KEY = '7e22288b7d4a4944aea9c62a872a4c6c';
const TD = 'https://api.twelvedata.com';

// Safari-safe fetch — no AbortController
function safeFetch(url) {
  return fetch(url).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

const delay = ms => new Promise(res => setTimeout(res, ms));

async function fetchMA(ticker){
  const t = ticker.replace('.BA','');
  const base = `${TD}/sma?symbol=${t}&apikey=${TWELVE_KEY}`;

  try {
    const getSMA = async (period, interval) => {
      try {
        const url = `${base}&interval=${interval}&time_period=${period}&outputsize=1`;
        const js = await safeFetch(url);
        if (js.status === 'error') {
          console.warn('SMA error', period, interval, js.message);
          return null;
        }
        return parseFloat(js.values?.[0]?.sma) || null;
      } catch(e) { return null; }
    };

    // Precio
    const priceJs = await safeFetch(`${TD}/price?symbol=${t}&apikey=${TWELVE_KEY}`);
    if (priceJs.code || priceJs.status === 'error') return null;
    const currentPrice = parseFloat(priceJs.price) || null;

    // Esperar 500ms entre cada llamada para no superar el rate limit
    await delay(500);
    const ma8d = await getSMA(8, '1day');
    await delay(500);
    const ma21d = await getSMA(21, '1day');
    await delay(500);
    const ma50d = await getSMA(50, '1day');
    await delay(500);
    const ma200d = await getSMA(200, '1day');
    await delay(500);
    const ma8w = await getSMA(8, '1week');
    await delay(500);
    const ma21w = await getSMA(21, '1week');
    await delay(500);
    const ma50w = await getSMA(50, '1week');
    await delay(500);
    const ma200w = await getSMA(200, '1week');

    return { currentPrice, ma8d, ma21d, ma50d, ma200d, ma8w, ma21w, ma50w, ma200w };

  } catch(e) {
    console.error('fetchMA:', e.name, e.message);
    return null;
  }
}

/* ── MA BARS & SIGNALS ───────────────────────────────────────────────────── */
function renderMABars(s){
  const d=[['MA 8D',s.ma8d],['MA 21D',s.ma21d],['MA 50D',s.ma50d],['MA 200D',s.ma200d]];
  const w=[['MA 8W',s.ma8w],['MA 21W',s.ma21w],['MA 50W',s.ma50w],['MA 200W',s.ma200w]];
  const bar=(l,ma,wkly)=>{
    if(!ma)return'';
    const pct=((s.currentPrice-ma)/ma*100),wd=Math.min(Math.abs(pct)*2.5,100),c=pct>=0?'#2ecc8a':'#e05555';
    return`<div class="ma-bar-row"><div class="ma-bar-labels"><span style="color:${wkly?'#f0a500':'#00bfae'};font-family:monospace;font-size:9px">${l}</span><span style="color:${c};font-family:monospace;font-size:10px">${pct>=0?'+':''}${pct.toFixed(1)}%</span></div><div class="ma-bar-track"><div class="ma-bar-fill" style="width:${wd}%;background:${c}"></div></div></div>`;
  };
  return`<div class="ma-grid"><div class="ma-panel"><div class="ma-panel-title" style="color:#00bfae">DIARIAS</div>${d.map(([l,m])=>bar(l,m,false)).join('')}</div><div class="ma-panel"><div class="ma-panel-title" style="color:#f0a500">SEMANALES</div>${w.map(([l,m])=>bar(l,m,true)).join('')}</div></div>`;
}
function renderSignals(s){
  const p=s.currentPrice;
  const checks=[
    {label:'Entrada corto',sub:'> MA8 y MA21',ok:s.ma8d&&s.ma21d&&p>s.ma8d&&p>s.ma21d,danger:false},
    {label:'Tendencia media',sub:'> MA50',ok:s.ma50d&&p>s.ma50d,danger:false},
    {label:'Bull LP',sub:'> MA200',ok:s.ma200d&&p>s.ma200d,danger:false},
    {label:'⚠ Riesgo',sub:'< MA50',ok:s.ma50d&&p<s.ma50d,danger:true},
    {label:'⚠ Bear semanal',sub:'< MA21W',ok:s.ma21w&&p<s.ma21w,danger:true},
  ].filter(c=>!c.danger||c.ok);
  return`<div class="signals">${checks.map(c=>{const col=c.danger?'#e05555':(c.ok?'#2ecc8a':'#5a7a92');return`<div class="signal" style="background:${col}18;border:1px solid ${col}33;color:${col}">${c.ok?(c.danger?'⚠':'✓'):'—'} ${c.label}<div class="signal-sub">${c.sub}</div></div>`;}).join('')}</div>`;
}

function renderStockRow(s,listKey){
  const ccl=getCCL();const p=s.currentPrice;
  const pnlVal=s.shares>0?(p-s.avgCost)*s.shares:null;
  const pnlPct=s.shares>0&&s.avgCost?(p-s.avgCost)/s.avgCost*100:null;
  const posVal=s.shares*p;const posARS=posVal*(ccl||1);
  const rs=riskLevel(s);const gc_=gc(s);const open=state.expanded[listKey+'_'+s.ticker];
  const maLoaded=s.ma50d>0;
  const _maState=state.loadingMA[listKey+'_'+s.ticker];
  const loading=_maState==='loading';
  const maError=_maState==='error';

  let expandedHTML='';
  if(open){
    const posD=s.shares>0?`<div class="pos-detail">
      <span class="pos-item">Acciones: <span>${fmt(s.shares,4)}</span></span>
      <span class="pos-item">Prom: <span>${s.isArg?fmtARS(s.avgCost):fmtUSD(s.avgCost)}</span></span>

      ${!s.isArg&&ccl?`<span class="pos-item">ARS: <span style="color:#f0a500">${fmtARS(posARS)}</span></span>`:''}
    </div>`:'';
    const maS=maLoaded
      ?`${renderMABars(s)}${renderSignals(s)}<button class="refresh-btn" onclick="loadOneMA(event,'${s.ticker}','${listKey}')">↺ Actualizar MAs</button>`
      :`<button class="load-ma-btn" style="${maError?'border-color:#e05555;color:#e05555':''}" onclick="loadOneMA(event,'${s.ticker}','${listKey}')">${loading?'⏳ Cargando…':maError?'⚠ Reintentar':'↓ Cargar Medias Móviles'}</button>`;
    expandedHTML=`<div class="expanded">${posD}${maS}</div>`;
  }

  const priceStr=s.isArg?fmtARS(p):fmtUSD(p);
  // Variación diaria + P&L posición
  const hasDailyChange = s.dailyChangePct != null;
  const pnlHTML = `<div style="text-align:right">
    ${hasDailyChange
      ? `<div class="pnl-main" style="color:${clr(s.dailyChangePct)}">${s.dailyChangePct>=0?'+':''}${fmt(s.dailyChangePct,2)}% hoy</div>
         <div class="pnl-sub" style="color:${clr(s.dailyChange)}">${s.dailyChange>=0?'+':''}${fmtUSD(s.dailyChange)}</div>`
      : ''
    }
    ${pnlVal!=null
      ? `<div class="pnl-sub" style="color:${clr(pnlPct)};margin-top:2px;border-top:1px solid #1a2840;padding-top:2px">${pctStr(pnlPct)} total</div>`
      : !hasDailyChange ? `<div class="no-pos">seguimiento</div>` : ''
    }
  </div>`;
  const pillsHTML=[pill(s.isArg?'ARG':s.group==='high'?'IA/Tech':'Conserv.',gc_),maLoaded?pill('MA✓','#00bfae'):''].join('');

  return`<div class="stock-row${open?' open':''}" style="border-left-color:${gc_}" id="row-${listKey}-${s.ticker.replace('.','-')}">
    <div class="stock-main" onclick="toggleRow('${s.ticker}','${listKey}')">
      <div><div class="ticker">${s.ticker}</div>${rs?`<div class="risk-label" style="color:${rs.color}">${rs.dot} ${rs.label}</div>`:''}</div>
      <div class="pills">${pillsHTML}</div>
      <div class="price-cell">${priceStr}</div>
      <div class="pnl-cell">${pnlHTML}</div>
      <div class="chevron">${open?'▲':'▼'}</div>
    </div>${expandedHTML}
  </div>`;
}

function sectionHead(label,color,list){
  if(!list.length)return'';
  const val=list.filter(s=>s.shares>0).reduce((a,s)=>a+s.shares*s.currentPrice,0);
  const valStr=list[0]?.isArg?fmtARS(val):val?fmtUSD(val):'';
  return`<div class="section-head">
    <div style="width:7px;height:7px;border-radius:1px;background:${color};flex-shrink:0"></div>
    <span style="font-size:10px;font-weight:700;color:${color};letter-spacing:.8px">${label}</span>
    <span class="pill" style="background:${color}22;color:${color};border:1px solid ${color}44">${list.length}</span>
    <div class="section-bar" style="background:${color}22"></div>
    ${valStr?`<span class="section-val">${valStr}</span>`:''}
  </div>`;
}

function applyFilters(list){
  return list.filter(s=>{
    if(state.filter==='high'&&s.group!=='high')return false;
    if(state.filter==='cons'&&s.group!=='cons')return false;
    if(state.filter==='arg'&&!s.isArg)return false;
    if(state.search&&!s.ticker.toLowerCase().includes(state.search.toLowerCase()))return false;
    return true;
  });
}

/* ── RENDER MAIN ─────────────────────────────────────────────────────────── */
function renderMain(){
  const main=document.getElementById('main');
  if(state.tab==='summary'){renderSummaryTab();return;}
  if(state.tab==='operar'){renderOperarTab();return;}

  const srcList=state.tab==='open'?state.stocks:state.watchlist;
  const list=applyFilters(srcList);
  const listKey=state.tab==='watch'?'w':'p';

  if(!list.length){main.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  const all=state.filter==='all';
  let html='';
  if(all||state.filter==='high'){const l=list.filter(s=>s.group==='high'&&!s.isArg);if(l.length)html+=sectionHead('IA / TECNOLOGÍA / ALTA VOLATILIDAD','#7c5cfc',l)+l.map(s=>renderStockRow(s,listKey)).join('');}
  if(all||state.filter==='cons'){const l=list.filter(s=>s.group==='cons'&&!s.isArg);if(l.length)html+=sectionHead('CONSERVADORAS / CEDEAR','#2a7fd4',l)+l.map(s=>renderStockRow(s,listKey)).join('');}
  if(all||state.filter==='arg') {const l=list.filter(s=>s.isArg);if(l.length)html+=sectionHead('ACCIONES ARGENTINAS — BYMA (ARS)','#f0a500',l)+l.map(s=>renderStockRow(s,listKey)).join('');}
  html+=`<div class="footer">Posiciones verificadas manualmente · Precios al 12/06/2026 · MAs bajo demanda</div>`;
  main.innerHTML=html;
}

function renderSummaryTab(){
  const ccl=getCCL()||1;
  const grand=state.stocks.reduce((a,s)=>a+s.shares*s.currentPrice*(s.isArg?1/ccl:1),0);
  const sorted=[...state.stocks].sort((a,b)=>{
    const va=a.shares*a.currentPrice*(a.isArg?1/ccl:1);
    const vb=b.shares*b.currentPrice*(b.isArg?1/ccl:1);
    return vb-va;
  });
  const items=sorted.map(s=>{
    const val=s.shares*s.currentPrice;const valUSD=s.isArg?val/ccl:val;
    const pct=grand?valUSD/grand*100:0;
    const pnl=s.avgCost?(s.currentPrice-s.avgCost)*s.shares:0;
    const pnlPct=s.avgCost?(s.currentPrice-s.avgCost)/s.avgCost*100:0;
    const gc_=gc(s);
    return`<div class="dist-item">
      <div class="dist-item-row">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="mono" style="font-weight:700;color:#d0dde8;min-width:80px;font-size:12px">${s.ticker}</span>
          <span style="font-size:10px;color:#5a7a92">${s.isArg?fmtARS(val):fmtUSD(val)}</span>
          ${s.avgCost>0?`<span class="mono" style="font-size:10px;color:${clr(pnl)}">${pnl>=0?'+':''}${s.isArg?fmtARS(pnl):fmtUSD(pnl)} (${pctStr(pnlPct)})</span>`:''}
        </div>
        <span class="mono" style="font-size:11px;color:${gc_}">${fmt(pct,1)}%</span>
      </div>
      <div class="dist-track"><div class="dist-fill" style="width:${pct}%;background:${gc_}"></div></div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`<div id="summary-tab"><div class="sum-card"><div class="sum-card-title">Distribución por posición (equiv. USD)</div>${items}</div></div>`;
}

/* ── ACTIONS ─────────────────────────────────────────────────────────────── */
function setTab(t){
  state.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}
// Also hide/show filterbar for operar tab
const _origRenderFilterBar = renderFilterBar;
function setFilter(f){state.filter=f;render();}
function doSearch(v){state.search=v;renderMain();renderFilterBar();}

function toggleRow(ticker,listKey){
  const key=listKey+'_'+ticker;
  state.expanded[key]=!state.expanded[key];
  renderMain();
  setTimeout(()=>{
    const id=`row-${listKey}-${ticker.replace('.','-')}`;
    const el=document.getElementById(id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}

async function loadOneMA(e,ticker,listKey){
  e.stopPropagation();
  const key=listKey+'_'+ticker;
  if(state.loadingMA[key]==='loading')return;
  state.loadingMA[key]='loading';renderMain();
  const data=await fetchMA(ticker);
  const list=listKey==='w'?state.watchlist:state.stocks;
  const s=list.find(s=>s.ticker===ticker);
  if(data&&s){Object.assign(s,data);state.loadingMA[key]='done';}
  else{state.loadingMA[key]='error';}
  renderMain();
}

/* ── AUTO PRECIO ─────────────────────────────────────────────────────── */
let priceUpdateInterval = null;
let lastPriceUpdate = null;

// Rastreo de créditos usados hoy
let creditsUsedToday = parseInt(localStorage.getItem('td_credits_'+new Date().toDateString())||'0');
function trackCredit(){
  creditsUsedToday++;
  localStorage.setItem('td_credits_'+new Date().toDateString(), creditsUsedToday);
}

async function updatePrices(){
  const usdStocks = state.stocks.filter(s=>!s.isArg);
  if(!usdStocks.length) return;

  // Plan free: 800 créditos/día, 8/min
  // Con 46 acciones = 46 créditos por ciclo
  // Ciclo cada 20 min = máx 3 ciclos/hora = 72 créditos/hora
  // En 8 horas de mercado = ~576 créditos, dentro del límite

  // Verificar que no superamos el límite diario
  if(creditsUsedToday >= 750){
    console.warn('Límite diario cerca, pausando actualizaciones');
    updatePriceTimestamp('⚠ Límite diario alcanzado');
    return;
  }

  for(let i=0; i<usdStocks.length; i++){
    const s = usdStocks[i];
    try {
      const url = `${TD}/quote?symbol=${s.ticker}&apikey=${TWELVE_KEY}`;
      const js = await safeFetch(url);
      trackCredit();
      if(js.status==='error' || js.code) continue;
      
      const newPrice = parseFloat(js.close) || parseFloat(js.price) || s.currentPrice;
      const prevClose = parseFloat(js.previous_close) || null;
      const change = prevClose ? newPrice - prevClose : null;
      const changePct = prevClose ? (change/prevClose)*100 : null;
      
      s.currentPrice = newPrice;
      s.dailyChange = change;
      s.dailyChangePct = changePct;
      
      lastPriceUpdate = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
      renderSummary();
      renderMain();
      updatePriceTimestamp();
      
    } catch(e) { console.error('quote error', s.ticker, e); }
    
    // 10 segundos entre requests = 6/min, bien bajo el límite de 8/min
    if(i < usdStocks.length-1) await delay(10000);
  }
}

function updatePriceTimestamp(msg){
  const el = document.getElementById('price-timestamp');
  if(!el) return;
  if(msg) { el.textContent = msg; el.style.color='#f0a500'; return; }
  if(lastPriceUpdate) { el.textContent = `Precios actualizados: ${lastPriceUpdate}`; el.style.color='#00bfae'; }
}

function startPriceUpdates(){
  updatePrices(); // Primera actualización inmediata
  priceUpdateInterval = setInterval(updatePrices, 1200000); // Luego cada 20 min
}

/* ── OPERAR TAB ──────────────────────────────────────────────────────── */
function calcPreview(){
  const ticker = document.getElementById('op-ticker').value.trim().toUpperCase();
  const tipo   = document.getElementById('op-tipo').value;
  const cedears = parseFloat(document.getElementById('op-cedears').value)||0;
  const precioARS = parseFloat(document.getElementById('op-precio').value)||0;
  const ccl = parseFloat(document.getElementById('op-ccl').value)||getCCL()||1500;
  const esArg = document.getElementById('op-esarg').value === 'arg';

  const preview = document.getElementById('op-preview');
  const btn = document.getElementById('op-btn');

  if(!ticker||!cedears||!precioARS){
    preview.classList.remove('show');
    if(btn) btn.style.display='none';
    return;
  }

  let accionesUSA, costoUSD, ratio;
  if(esArg){
    // Acción argentina: cantidad directa en ARS
    accionesUSA = cedears;
    costoUSD = precioARS / ccl;
    ratio = 1;
  } else {
    ratio = BYMA_RATIOS[ticker] || BYMA_RATIOS[ticker.replace('-','')];
    if(!ratio){
      preview.innerHTML = `<div style="color:#e05555;font-size:12px">⚠ Ticker no encontrado en BYMA. Ingresá el ratio manualmente:</div>
        <div style="margin-top:8px"><div class="op-label">Ratio BYMA (CEDEARs por 1 acción USA)</div>
        <input class="op-input" id="op-ratio-manual" type="number" placeholder="ej: 25" oninput="calcPreview()" style="margin-top:4px"/></div>`;
      preview.classList.add('show');
      const manualRatio = parseFloat(document.getElementById('op-ratio-manual')?.value)||0;
      if(!manualRatio) return;
      ratio = manualRatio;
    }
    accionesUSA = cedears / ratio;
    costoUSD = precioARS * ratio / ccl;
  }

  // Buscar posición actual
  const posActual = state.stocks.find(s=>s.ticker===ticker||s.ticker===ticker+'.BA');
  let nuevoProm = costoUSD;
  let nuevasCantidad = accionesUSA;

  if(tipo==='buy' && posActual && posActual.shares > 0){
    nuevasCantidad = posActual.shares + accionesUSA;
    nuevoProm = (posActual.shares * posActual.avgCost + accionesUSA * costoUSD) / nuevasCantidad;
  } else if(tipo==='sell' && posActual){
    nuevasCantidad = Math.max(0, posActual.shares - accionesUSA);
  }

  preview.innerHTML = `
    <div style="font-size:10px;color:#00bfae;font-weight:700;margin-bottom:8px;letter-spacing:.5px">PREVIEW DE LA OPERACIÓN</div>
    <div class="op-preview-row"><span class="op-preview-label">Ticker</span><span class="op-preview-val">${ticker}</span></div>
    ${!esArg?`<div class="op-preview-row"><span class="op-preview-label">Ratio BYMA</span><span class="op-preview-val">${ratio}:1</span></div>`:''}
    <div class="op-preview-row"><span class="op-preview-label">Acciones USA equiv.</span><span class="op-preview-val">${accionesUSA.toFixed(4)}</span></div>
    <div class="op-preview-row"><span class="op-preview-label">Precio USD/acc</span><span class="op-preview-val">$${costoUSD.toFixed(2)}</span></div>
    <div class="op-preview-row" style="border-top:1px solid #1a2840;padding-top:8px;margin-top:4px">
      <span class="op-preview-label">Nueva posición</span>
      <span class="op-preview-val" style="color:${tipo==='buy'?'#2ecc8a':'#e05555'}">${nuevasCantidad.toFixed(4)} acc @ $${nuevoProm.toFixed(2)}</span>
    </div>`;
  preview.classList.add('show');

  if(btn){
    btn.style.display='block';
    btn.className = `op-btn ${tipo==='buy'?'op-btn-buy':'op-btn-sell'}`;
    btn.textContent = tipo==='buy' ? `✓ Confirmar Compra` : `✓ Confirmar Venta`;
  }
}

function confirmarOperacion(){
  const ticker  = document.getElementById('op-ticker').value.trim().toUpperCase();
  const tipo    = document.getElementById('op-tipo').value;
  const cedears = parseFloat(document.getElementById('op-cedears').value)||0;
  const precioARS = parseFloat(document.getElementById('op-precio').value)||0;
  const ccl   = parseFloat(document.getElementById('op-ccl').value)||getCCL()||1500;
  const esArg = document.getElementById('op-esarg').value === 'arg';

  let ratio = esArg ? 1 : (BYMA_RATIOS[ticker] || parseFloat(document.getElementById('op-ratio-manual')?.value)||1);
  const accionesUSA = esArg ? cedears : cedears / ratio;
  const costoUSD = esArg ? precioARS / ccl : precioARS * ratio / ccl;

  // Buscar o crear posición
  let s = state.stocks.find(st=>st.ticker===ticker||st.ticker===ticker+'.BA');

  if(tipo==='buy'){
    if(s){
      const totalShares = s.shares + accionesUSA;
      s.avgCost = (s.shares * s.avgCost + accionesUSA * costoUSD) / totalShares;
      s.shares = totalShares;
    } else {
      // Nueva posición
      const group = esArg ? 'arg' : (ticker in {'NVDA':1,'META':1,'MSFT':1,'GOOG':1,'TSLA':1,'PLTR':1,'HUT':1,'IREN':1,'MSTR':1,'OKLO':1,'TQQQ':1,'RKLB':1,'ALAB':1,'NBIS':1,'ANET':1,'CEG':1,'VST':1,'GE':1,'IBM':1,'SNDK':1,'ETHA':1,'URA':1,'MELI':1,'SPOT':1,'NFLX':1,'AVGO':1,'NU':1,'MU':1} ? 'high' : 'cons');
      state.stocks.push({ticker, shares:accionesUSA, avgCost:costoUSD, currentPrice:costoUSD,
        group, isArg:esArg, ma8d:0,ma21d:0,ma50d:0,ma200d:0,ma8w:0,ma21w:0,ma50w:0,ma200w:0,
        dailyChange:null,dailyChangePct:null});
    }
  } else {
    if(s) s.shares = Math.max(0, s.shares - accionesUSA);
  }

  // Guardar en historial
  const op = {
    date: new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}),
    ticker, tipo, cedears, ratio, accionesUSA:+accionesUSA.toFixed(4),
    precioARS, costoUSD:+costoUSD.toFixed(2), ccl
  };
  state.opHistory.unshift(op);
  if(state.opHistory.length > 200) state.opHistory.pop();
  localStorage.setItem('op_history', JSON.stringify(state.opHistory));

  // Limpiar form
  ['op-ticker','op-cedears','op-precio'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('op-preview').classList.remove('show');
  document.getElementById('op-btn').style.display='none';

  renderSummary();
  setTab2('open');
  alert(`✓ ${tipo==='buy'?'Compra':'Venta'} de ${ticker} registrada: ${accionesUSA.toFixed(4)} acc @ $${costoUSD.toFixed(2)}`);
}

function setTab2(t){
  state.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  const btns = document.querySelectorAll('.tab');
  const map = {'open':0,'watch':1,'operar':2,'summary':3};
  if(btns[map[t]]) btns[map[t]].classList.add('active');
  render();
}

function renderOperarTab(){
  const ccl = getCCL()||1500;
  const histHTML = state.opHistory.length === 0
    ? '<div style="color:#5a7a92;font-size:12px;text-align:center;padding:16px">Sin operaciones registradas</div>'

        const col = op.tipo==='buy'?'#2ecc8a':'#e05555';
        return `<div class="op-hist-row">
          <span class="op-hist-ticker" style="color:${col}">${op.ticker}</span>
          <span class="op-hist-detail">${op.date} · ${op.cedears} CEDEARs @ $${op.precioARS.toLocaleString('es-AR')}</span>
          <span class="op-hist-val" style="color:${col}">${op.tipo==='buy'?'+':'-'}${op.accionesUSA} acc<br>$${op.costoUSD} USD</span>
        </div>`;
      }).join('');

  document.getElementById('main').innerHTML = `
    <div class="op-form">
      <div class="op-title">Nueva Operación</div>
      <div class="op-row">
        <div>
          <div class="op-label">Ticker</div>
          <input class="op-input" id="op-ticker" type="text" placeholder="ej: NVDA" oninput="this.value=this.value.toUpperCase();calcPreview()"/>
        </div>
        <div>
          <div class="op-label">Tipo</div>
          <select class="op-select" id="op-tipo" onchange="calcPreview()">
            <option value="buy">COMPRA</option>
            <option value="sell">VENTA</option>
          </select>
        </div>
      </div>
      <div class="op-row">
        <div>
          <div class="op-label">Instrumento</div>
          <select class="op-select" id="op-esarg" onchange="calcPreview()">
            <option value="cedear">CEDEAR (USA)</option>
            <option value="arg">Acción ARG (BYMA)</option>
          </select>
        </div>
        <div>
          <div class="op-label">CCL ($)</div>
          <input class="op-input" id="op-ccl" type="number" placeholder="${ccl}" value="${ccl}" oninput="calcPreview()"/>
        </div>
      </div>
      <div class="op-row">
        <div>
          <div class="op-label">Cantidad CEDEARs</div>
          <input class="op-input" id="op-cedears" type="number" placeholder="ej: 150" oninput="calcPreview()"/>
        </div>
        <div>
          <div class="op-label">Precio ARS por CEDEAR</div>
          <input class="op-input" id="op-precio" type="number" placeholder="ej: 4620" oninput="calcPreview()"/>
        </div>
      </div>
      <div class="op-preview" id="op-preview"></div>
      <button class="op-btn op-btn-buy" id="op-btn" onclick="confirmarOperacion()" style="display:none">✓ Confirmar</button>
    </div>
    <div class="op-hist">
      <div class="op-hist-title">Historial de operaciones (${state.opHistory.length})</div>
      ${histHTML}
    </div>`;
}

function render(){renderSummary();renderFilterBar();renderMain();}
render();
startPriceUpdates();
</script>
